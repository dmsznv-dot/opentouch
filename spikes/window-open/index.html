<!doctype html><html><body style="background:#111">
<canvas id="c" width="320" height="180"></canvas>
<script>
const VS=`#version 300 es
in vec2 p; out vec2 uv; void main(){ uv=vec2(p.x*.5+.5, .5-p.y*.5); gl_Position=vec4(p,0,1);} `;
const FS=`#version 300 es
precision mediump float; in vec2 uv; uniform sampler2D t; out vec4 o; void main(){ o=texture(t,uv);} `;
function setup(canvas){
  const gl=canvas.getContext('webgl2',{alpha:false});
  const prog=gl.createProgram();
  for (const [type,src] of [[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,FS]]) { const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); gl.attachShader(prog,s); }
  gl.linkProgram(prog); gl.useProgram(prog);
  const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return gl;
}
function draw(gl, video){
  if (video.readyState>=2) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  const px=new Uint8Array(4); gl.readPixels(gl.drawingBufferWidth>>1, gl.drawingBufferHeight>>1,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  return Array.from(px);
}
const video=document.createElement('video');
video.src=new URLSearchParams(location.search).get('v')||'/tests/fixtures/bars.webm';
video.muted=true; video.loop=true; video.play();
window.result={parent:null, child:null, errors:[]};
const pgl=setup(document.getElementById('c'));
(function loop(){ window.result.parent=draw(pgl,video); requestAnimationFrame(loop); })();
const child=window.open('output.html','opentouch-output','width=320,height=180');
child.addEventListener('load',()=>{
  try{
    const cv=child.document.createElement('canvas'); cv.width=320; cv.height=180;
    child.document.body.appendChild(cv);
    const cgl=setup(cv);
    (function cl(){ window.result.child=draw(cgl,video); child.requestAnimationFrame(cl); })();
  }catch(e){ window.result.errors.push(String(e)); }
});
</script></body></html>
